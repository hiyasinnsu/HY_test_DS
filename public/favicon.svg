<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="弾幕シューティング">
  <!-- Self-contained neon bullet: dark tile, pink orb core, cyan ring. No external refs. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fff6fb"/>
      <stop offset="0.38" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#a81f8a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#ff7ad9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#05030d"/>
  <circle cx="16" cy="16" r="15" fill="url(#halo)"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#5ce8ff" stroke-width="1.6" stroke-opacity="0.85"/>
  <circle cx="16" cy="16" r="6.4" fill="url(#core)"/>
  <circle cx="13.6" cy="13.4" r="2" fill="#ffffff" fill-opacity="0.85"/>
</svg>
